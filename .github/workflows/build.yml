name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          # Create a minimal gradlew if missing
          if [ ! -f gradlew ]; then
            echo "Creating basic gradlew..."
            cat > gradlew << 'GRADLEW'
#!/bin/sh
exec java -jar gradle/wrapper/gradle-wrapper.jar "$@"
GRADLEW
            chmod +x gradlew
          fi
          chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          # Use Gradle directly since wrapper jar may be missing
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrazdnikVPN-debug
          path: app/build/outputs/apk/debug/*.apk
