name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Show what is in the repo
        run: |
          echo "=== Root ==="
          ls -la
          echo ""
          echo "=== Looking for ZIP files ==="
          find . -name "*.zip" -type f

      - name: Unzip project
        run: |
          if [ -f "PrazdnikVPN.zip" ]; then
            unzip -q PrazdnikVPN.zip
            echo "Unzipped PrazdnikVPN.zip"
          elif [ -f "PrazdnikVPN-configs.zip" ]; then
            echo "ERROR: В репозитории лежит ZIP с конфигами, а не с проектом приложения!"
            echo "Нужен файл PrazdnikVPN.zip (исходники приложения)"
            exit 1
          else
            echo "ZIP not found, trying to find project..."
            find . -name "settings.gradle.kts" || true
            exit 1
          fi
          ls -la
          ls -la PrazdnikVPN/ || true

      - name: Create gradle.properties
        run: |
          mkdir -p PrazdnikVPN
          cat > PrazdnikVPN/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          kotlin.code.style=official
          EOF
          cat PrazdnikVPN/gradle.properties

      - name: Fix AndroidManifest (remove missing icon)
        run: |
          if [ -f "PrazdnikVPN/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:icon="@mipmap\/ic_launcher"//' PrazdnikVPN/app/src/main/AndroidManifest.xml
            sed -i 's/android:roundIcon="@mipmap\/ic_launcher"//' PrazdnikVPN/app/src/main/AndroidManifest.xml || true
          fi

      - name: Download Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip

      - name: Build Debug APK
        working-directory: PrazdnikVPN
        run: ../gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrazdnikVPN-debug
          path: PrazdnikVPN/app/build/outputs/apk/debug/*.apk
