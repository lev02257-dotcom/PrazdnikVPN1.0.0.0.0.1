name: Build APK

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "=== Current directory ==="
          pwd
          echo ""
          echo "=== Root files ==="
          ls -la
          echo ""
          echo "=== Looking for settings.gradle.kts ==="
          find . -name "settings.gradle.kts" -o -name "settings.gradle" 2>/dev/null
          echo ""
          echo "=== Looking for build.gradle ==="
          find . -name "build.gradle.kts" -o -name "build.gradle" 2>/dev/null
          echo ""
          echo "=== Full tree (max depth 4) ==="
          find . -maxdepth 4 -type d | head -50
