name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip project
        run: unzip -q PrazdnikVPN-configs.zip

      - name: Create gradle.properties
        run: |
          cat > PrazdnikVPN/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          kotlin.code.style=official
          EOF

      - name: Fix AndroidManifest (remove missing icon)
        run: |
          sed -i 's/android:icon="@mipmap\/ic_launcher"//' PrazdnikVPN/app/src/main/AndroidManifest.xml
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher"//' PrazdnikVPN/app/src/main/AndroidManifest.xml || true
          cat PrazdnikVPN/app/src/main/AndroidManifest.xml

      - name: Download Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip

      - name: Build Debug APK
        working-directory: PrazdnikVPN
        run: ../gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrazdnikVPN-debug
          path: PrazdnikVPN/app/build/outputs/apk/debug/*.apk
